<!DOCTYPE html>
<html lang="en" data-theme="warmed-ink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbor — Decision Intelligence</title>
  <meta name="description" content="Arbor — premium decision tree builder with Monte Carlo, sensitivity analysis, and audit-ready exports.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/app.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <!-- Export dependencies (loaded only on app.html — landing page stays untouched). -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="app-header">
    <a href="index.html" class="brand">Arbor</a>
    <span class="brand-sep"></span>
    <span class="brand-sub">Decision Intelligence</span>

    <div class="header-stats">
      <div class="hstat"><span class="hstat-l">EV (mean)</span><span class="hstat-v" id="h-ev">—</span></div>
      <div class="hstat"><span class="hstat-l">Seed</span><span class="hstat-v" id="h-seed">42</span></div>
      <div class="hstat"><span class="hstat-l">Iterations</span><span class="hstat-v" id="h-iter">10000</span></div>
      <div class="hstat"><span class="hstat-l">Nodes</span><span class="hstat-v" id="h-nodes">0</span></div>
    </div>

    <div class="spacer"></div>

    <!-- Theme toggle (mounted by themeToggle.js) -->
    <div id="header-actions-pre"></div>

    <button class="btn" id="btn-layout">Auto Layout</button>
    <button class="btn" id="btn-results">Results</button>
    <button class="btn" id="btn-export-pdf"><span style="color:var(--accent)">⬡</span> PDF</button>
    <button class="btn" id="btn-export-svg"><span style="color:var(--accent)">⬡</span> SVG</button>
    <button class="btn" id="btn-export-xlsx"><span style="color:var(--accent)">⬡</span> Excel</button>
    <button class="btn" id="btn-new">+ New Tree</button>
    <button class="btn btn-primary" id="btn-simulate">Run Simulation</button>
  </header>

  <!-- MAIN -->
  <div class="app-main">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="canvas"></canvas>

      <div class="canvas-hints">
        <span class="hint">click to select</span>
        <span class="hint">drag node to move</span>
        <span class="hint">drag canvas to pan</span>
        <span class="hint">scroll to zoom</span>
        <span class="hint">hover · click + to add child</span>
      </div>

      <!-- Simulation progress (created by main.js) -->
      <div class="status-bar" id="status-bar">
        <span id="status-bar-text">Initialising…</span>
        <div class="progress"><div class="fill" id="status-bar-fill"></div></div>
      </div>
    </div>

    <aside class="inspector" id="inspector">
      <div class="resize-handle h" id="inspector-handle" aria-hidden="true"></div>
      <button class="rail-toggle inspector-rail-toggle" id="inspector-toggle" type="button" aria-label="Toggle inspector">
        <span class="toggle-text">›</span>
      </button>
      <div class="inspector-header">
        <div class="inspector-title">Inspector</div>
        <div class="inspector-sub">Selected node</div>
      </div>
      <div class="inspector-body" id="inspector-body"></div>
    </aside>
  </div>

  <!-- DASHBOARD -->
  <section class="dashboard" id="dashboard">
    <div class="resize-handle v" id="dashboard-handle" aria-hidden="true"></div>
    <button class="rail-toggle dashboard-rail-toggle" id="dashboard-toggle" type="button" aria-label="Toggle dashboard">
      <span class="toggle-text">⌄</span>
    </button>
  </section>

</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
